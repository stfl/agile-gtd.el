name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Emacs ${{ matrix.emacs-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "30.2"
        include:
          # Emacs 31 coverage.  nix-emacs-ci, which purcell/setup-emacs installs
          # from, ships no released 31.x: "release-snapshot" builds the emacs-31
          # branch (31.0.91), while "snapshot" builds master (32.x).  The entry
          # is non-fatal so upstream churn cannot red the build; "30.2" is the
          # hard requirement and matches the version floor in Eask.
          - emacs-version: "release-snapshot"
            experimental: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Emacs ${{ matrix.emacs-version }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Eask
        uses: emacs-eask/setup-eask@master
        with:
          version: snapshot

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: eask install-deps

      - name: Byte-compile
        run: just build

      - name: Lint
        run: just lint

      - name: Run ERT tests
        run: just test
