name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Emacs ${{ matrix.emacs-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two released builds, both carried as such by nix-emacs-ci, which is
        # where purcell/setup-emacs installs from.  "30.2" is the version floor
        # declared in Eask and "31.1" the newest release, and both gate the
        # build: a package that claims a floor should be tested at it.
        #
        # The pair earns its place rather than duplicating one run.  These two
        # differ in whether warnings.el is preloaded, and the suite's warning
        # capture is sensitive to that, so a test can pass on one and fail on
        # the other.
        emacs-version:
          - "30.2"
          - "31.1"

    steps:
      - uses: actions/checkout@v6

      - name: Install Emacs ${{ matrix.emacs-version }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Eask
        uses: emacs-eask/setup-eask@master
        with:
          version: snapshot

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: eask install-deps

      - name: Byte-compile
        run: just build

      - name: Lint
        run: just lint

      - name: Run ERT tests
        run: just test
